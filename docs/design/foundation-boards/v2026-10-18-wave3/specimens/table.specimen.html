<!-- Table specimen: legacy .eg-table-wrap / .eg-table / .eg-check / .eg-status / .eg-btn from Foundation components/bundle.css; inline styles use tokens only. Shows contract states the Table.png board does not: sorting, selection (row + indeterminate select-all), selected row, active row with start bar, compact size, details variant and empty state. -->
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<div style="box-sizing:border-box;padding:var(--space-6);background:var(--color-bg-canvas);color:var(--color-fg-default);font-family:var(--font-sans);display:flex;flex-direction:column;gap:var(--space-8);max-width:calc(var(--space-24) * 10)">

  <figure style="margin:0;display:flex;flex-direction:column;gap:var(--space-2)">
    <div class="eg-table-wrap">
      <table class="eg-table">
        <caption>Review rules</caption>
        <thead>
          <tr>
            <th scope="col" style="width:1%">
              <span style="display:inline-grid;place-items:center;box-sizing:border-box;width:calc(var(--space-4) + var(--focus-width));height:calc(var(--space-4) + var(--focus-width));border-radius:var(--radius-sm);border:1px solid var(--color-action-primary-solid-bg);background:var(--gradient-btn-primary);box-shadow:var(--shadow-btn-primary);vertical-align:middle" role="checkbox" aria-checked="mixed" aria-label="Select all rows"><span style="display:block;width:var(--space-2);height:var(--focus-width);background:var(--color-action-primary-solid-fg)"></span></span>
            </th>
            <th scope="col">Pattern</th>
            <th scope="col">Status</th>
            <th scope="col" class="eg-table__num" aria-sort="ascending">
              <button type="button" style="all:unset;display:inline-flex;align-items:center;gap:var(--space-1);cursor:pointer;color:var(--color-fg-default)">Warnings
                <svg viewBox="0 0 24 24" aria-hidden="true" style="width:var(--space-3);height:var(--space-3);fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
              </button>
            </th>
            <th scope="col" class="eg-table__acts"><span style="position:absolute;width:0;height:0;overflow:hidden;white-space:nowrap">Actions</span></th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td style="width:1%"><label class="eg-check" style="min-height:0"><input type="checkbox" aria-label="Select Teaser opener"></label></td>
            <th scope="row" style="position:static;width:auto;white-space:normal;padding:var(--space-3) var(--space-4);font:inherit;text-transform:none;letter-spacing:0;color:var(--color-fg-default);background:none;border-bottom:1px solid var(--color-border-subtle)"><span class="eg-table__code">"Spoiler: ..."</span></th>
            <td><span class="eg-status eg-status--neutral">Draft</span></td>
            <td class="eg-table__num">2</td>
            <td class="eg-table__acts"><button type="button" class="eg-btn eg-btn--ghost eg-btn--sm">Edit</button></td>
          </tr>
          <tr style="background:var(--color-surface-3)">
            <td style="width:1%"><label class="eg-check" style="min-height:0"><input type="checkbox" checked aria-label="Select The key is"></label></td>
            <th scope="row" style="position:static;width:auto;white-space:normal;padding:var(--space-3) var(--space-4);font:inherit;text-transform:none;letter-spacing:0;color:var(--color-fg-default);background:none;border-bottom:1px solid var(--color-border-subtle)"><span class="eg-table__code">"The key is..."</span></th>
            <td><span class="eg-status eg-status--success">Active</span></td>
            <td class="eg-table__num">7</td>
            <td class="eg-table__acts"><button type="button" class="eg-btn eg-btn--ghost eg-btn--sm">Edit</button></td>
          </tr>
          <tr style="background:var(--color-bg-brand-subtle)" aria-current="true">
            <td style="width:1%;position:relative"><span style="position:absolute;inset-block:0;inset-inline-start:0;width:var(--focus-width);background:var(--color-action-primary-solid-bg)"></span><label class="eg-check" style="min-height:0"><input type="checkbox" aria-label="Select The problem is not X"></label></td>
            <th scope="row" style="position:static;width:auto;white-space:normal;padding:var(--space-3) var(--space-4);font:inherit;text-transform:none;letter-spacing:0;color:var(--color-fg-default);background:none;border-bottom:0"><span class="eg-table__code">"The problem is not X. It is Y."</span></th>
            <td><span class="eg-status eg-status--warning">Review</span></td>
            <td class="eg-table__num">12</td>
            <td class="eg-table__acts"><button type="button" class="eg-btn eg-btn--ghost eg-btn--sm">Edit</button></td>
          </tr>
        </tbody>
      </table>
    </div>
    <figcaption style="font-size:var(--text-label-default);color:var(--color-fg-muted)">Data, selectable, sorted by Warnings ascending (aria-sort, header button, arrow glyph). Select-all indeterminate; row 2 selected (surface-3); row 3 active (brand-subtle tint and start bar, aria-current). Status as Badge, row action as ghost Button.</figcaption>
  </figure>

  <figure style="margin:0;display:flex;flex-direction:column;gap:var(--space-2)">
    <div class="eg-table-wrap">
      <table class="eg-table eg-table--compact">
        <caption>Chat commands</caption>
        <thead><tr><th scope="col"><button type="button" style="all:unset;cursor:pointer">Command</button></th><th scope="col">Description</th><th scope="col" class="eg-table__num"><button type="button" style="all:unset;cursor:pointer">Uses</button></th></tr></thead>
        <tbody>
          <tr><td><span class="eg-table__code">!discord</span></td><td>Posts the community invite.</td><td class="eg-table__num">48</td></tr>
          <tr><td><span class="eg-table__code">!stack</span></td><td>Lists the current tools.</td><td class="eg-table__num">31</td></tr>
          <tr><td><span class="eg-table__code">!uptime</span></td><td>Shows stream time.</td><td class="eg-table__num">9</td></tr>
        </tbody>
      </table>
    </div>
    <figcaption style="font-size:var(--text-label-default);color:var(--color-fg-muted)">Size sm (compact cells). Sortable headers, none sorted yet: no aria-sort, no glyph.</figcaption>
  </figure>

  <figure style="margin:0;display:flex;flex-direction:column;gap:var(--space-2)">
    <div class="eg-table-wrap" style="max-width:calc(var(--space-24) * 5)">
      <table class="eg-table">
        <caption>File details</caption>
        <tbody>
          <tr><th scope="row">Format</th><td>PNG</td></tr>
          <tr><th scope="row">Dimensions</th><td>1280 × 720</td></tr>
          <tr><th scope="row">Created</th><td>18 October 2026</td></tr>
        </tbody>
      </table>
    </div>
    <figcaption style="font-size:var(--text-label-default);color:var(--color-fg-muted)">Variant details: key/value rows with muted row headers, no column header row.</figcaption>
  </figure>

  <figure style="margin:0;display:flex;flex-direction:column;gap:var(--space-2)">
    <div class="eg-table-wrap">
      <table class="eg-table">
        <caption>Experiments</caption>
        <thead><tr><th scope="col">Name</th><th scope="col">Owner</th><th scope="col" class="eg-table__num">Runs</th></tr></thead>
        <tbody><tr><td colspan="3" style="padding:var(--space-6) var(--space-4);text-align:center;color:var(--color-fg-muted)">No rows</td></tr></tbody>
      </table>
    </div>
    <figcaption style="font-size:var(--text-label-default);color:var(--color-fg-muted)">Empty rows: one full-width message cell (messages.empty).</figcaption>
  </figure>
</div>
