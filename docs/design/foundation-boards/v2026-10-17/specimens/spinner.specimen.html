<!-- Spinner specimen v0.1: no Foundation board. Static frame of the open-arc spinner (rotation is verified in the browser). Only bundle.css classes and token var() inline styles. -->
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<div style="box-sizing:border-box;margin:0;padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-6);background:var(--color-bg-canvas);color:var(--color-fg-default);font-family:var(--font-sans)">

  <section style="display:flex;flex-direction:column;gap:var(--space-3);padding-bottom:var(--space-5);border-bottom:1px solid var(--color-border-subtle)">
    <p style="margin:0;color:var(--color-fg-muted);text-transform:uppercase;font-size:var(--text-meta)">sizes: sm 16 · md 20 · lg 28</p>
    <div style="display:flex;flex-wrap:wrap;align-items:flex-end;gap:var(--space-6)">
      <div style="display:flex;flex-direction:column;align-items:flex-start;gap:var(--space-2)">
        <span style="display:inline-flex"><svg class="eg-icon eg-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg></span>
        <span style="color:var(--color-fg-muted);font-size:var(--text-meta)">sm</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-start;gap:var(--space-2)">
        <span style="display:inline-flex"><svg class="eg-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg></span>
        <span style="color:var(--color-fg-muted);font-size:var(--text-meta)">md (default)</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-start;gap:var(--space-2)">
        <span style="display:inline-flex"><svg class="eg-icon eg-icon--lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg></span>
        <span style="color:var(--color-fg-muted);font-size:var(--text-meta)">lg</span>
      </div>
    </div>
  </section>

  <section style="display:flex;flex-direction:column;gap:var(--space-3);padding-bottom:var(--space-5);border-bottom:1px solid var(--color-border-subtle)">
    <p style="margin:0;color:var(--color-fg-muted);text-transform:uppercase;font-size:var(--text-meta)">inherited color (currentColor)</p>
    <div style="display:flex;flex-wrap:wrap;align-items:flex-end;gap:var(--space-6)">
      <div style="display:flex;flex-direction:column;align-items:flex-start;gap:var(--space-2)">
        <span style="display:inline-flex;align-items:center;gap:var(--space-2);color:var(--color-fg-default);font-size:var(--text-label-default)"><svg class="eg-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>Loading posts</span>
        <span style="color:var(--color-fg-muted);font-size:var(--text-meta)">fg-default, with visible text</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-start;gap:var(--space-2)">
        <span style="display:inline-flex;color:var(--color-fg-secondary)"><svg class="eg-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg></span>
        <span style="color:var(--color-fg-muted);font-size:var(--text-meta)">fg-secondary</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-start;gap:var(--space-2)">
        <span style="display:inline-flex;color:var(--color-fg-muted)"><svg class="eg-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg></span>
        <span style="color:var(--color-fg-muted);font-size:var(--text-meta)">fg-muted</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-start;gap:var(--space-2)">
        <span style="display:inline-flex;padding:var(--space-3);border-radius:var(--radius-md);background:var(--gradient-sheen),var(--color-surface-1);box-shadow:var(--shadow-edge),var(--shadow-elev-1);color:var(--color-fg-brand-raised)"><svg class="eg-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg></span>
        <span style="color:var(--color-fg-muted);font-size:var(--text-meta)">fg-brand-raised on surface-1</span>
      </div>
    </div>
  </section>

  <section style="display:flex;flex-direction:column;gap:var(--space-3)">
    <p style="margin:0;color:var(--color-fg-muted);text-transform:uppercase;font-size:var(--text-meta)">composed in Button loading (decorative)</p>
    <div style="display:flex;flex-wrap:wrap;align-items:flex-end;gap:var(--space-5)">
      <div style="display:flex;flex-direction:column;align-items:flex-start;gap:var(--space-2)">
        <button class="eg-btn eg-btn--primary" type="button" aria-busy="true" style="cursor:progress">Saving <svg class="eg-btn__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg></button>
        <span style="color:var(--color-fg-muted);font-size:var(--text-meta)">primary (black)</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-start;gap:var(--space-2)">
        <button class="eg-btn eg-btn--secondary" type="button" aria-busy="true" style="cursor:progress"><svg class="eg-btn__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>Publishing</button>
        <span style="color:var(--color-fg-muted);font-size:var(--text-meta)">secondary (white)</span>
      </div>
    </div>
  </section>
</div>
