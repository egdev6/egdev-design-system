<!-- Dropzone specimen: inline row variant missing from the Foundation board. Foundation classes only; inline styles use tokens. -->
<div style="box-sizing:border-box;padding:var(--space-6);display:grid;gap:var(--space-5);width:50%;font-family:var(--font-sans);color:var(--color-fg-default)">
  <div style="display:grid;gap:var(--space-2)">
    <span style="font-size:var(--text-meta);color:var(--color-fg-muted)">variant="inline" — at rest</span>
    <button type="button" class="eg-dropzone eg-dropzone--inline"><svg class="eg-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>Drag, paste or upload</button>
  </div>
  <div style="display:grid;gap:var(--space-2)">
    <span style="font-size:var(--text-meta);color:var(--color-fg-muted)">variant="inline" — files dragged over (data-state="over")</span>
    <button type="button" class="eg-dropzone eg-dropzone--inline is-over"><svg class="eg-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>Drop here</button>
  </div>
</div>
