# Repository-owned advisory analysis for issue #15.
# Findings require human triage; execution errors fail the corresponding job.
# No project package install, build, script or pull_request_target event runs here.
name: Code safety

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - name: Checkout untrusted source as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL without a project build
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze and publish advisory alerts
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}

  secrets:
    name: Gitleaks advisory
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout full history without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks CLI
        shell: bash
        env:
          GITLEAKS_ARCHIVE_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          stage="$(mktemp -d "$RUNNER_TEMP/gitleaks.XXXXXX")"
          trap 'rm -rf -- "$stage"' EXIT
          archive="$stage/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "$archive" \
            'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz'
          printf '%s  %s\n' "$GITLEAKS_ARCHIVE_SHA256" "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$stage" gitleaks
          test -f "$stage/gitleaks" && test ! -L "$stage/gitleaks"
          install -m 0755 "$stage/gitleaks" "$RUNNER_TEMP/gitleaks-bin"
      - name: Scan history and publish a count, never secret values
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d "$RUNNER_TEMP/gitleaks-scan.XXXXXX")"
          trap 'rm -rf -- "$stage"' EXIT
          report="$stage/report.json"
          error_log="$stage/error.log"
          policy="$stage/policy.toml"
          ignored="$stage/empty-ignore"
          snapshot="$stage/repo.git"
          # Scan inert Git objects in a bare clone: no PR-controlled config or
          # .gitleaksignore file is present at the scanner's source path.
          if ! git clone --bare --local --no-hardlinks "$GITHUB_WORKSPACE" "$snapshot" > /dev/null 2> "$error_log"; then
            echo 'Gitleaks snapshot preparation failed; details withheld.' >&2
            exit 2
          fi
          commit="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ || "$commit" != "$GITHUB_SHA" ]]; then
            echo 'Gitleaks target commit mismatch.' >&2
            exit 2
          fi
          git -C "$snapshot" update-ref refs/heads/scan "$commit"
          git -C "$snapshot" symbolic-ref HEAD refs/heads/scan
          printf '[extend]\nuseDefault = true\n' > "$policy"
          : > "$ignored"
          set +e
          "$RUNNER_TEMP/gitleaks-bin" git \
            --config="$policy" --gitleaks-ignore-path="$ignored" --ignore-gitleaks-allow \
            --redact=100 --exit-code=0 --no-banner --no-color --log-level=error \
            --report-format=json --report-path="$report" "$snapshot" \
            > /dev/null 2> "$error_log"
          result=$?
          set -e
          # v8.30.1 can return zero after a Git error while logging it to stderr.
          # At error log level, any stderr output is an operational failure.
          if [ "$result" -ne 0 ] || [ -s "$error_log" ]; then
            echo 'Gitleaks execution reported an error; scanner output withheld.' >&2
            exit 2
          fi
          node - "$report" <<'NODE'
          const fs = require('node:fs');
          try {
            const limit = 16 * 1024 * 1024;
            if (fs.statSync(process.argv[2]).size > limit) throw new Error();
            const data = fs.readFileSync(process.argv[2], 'utf8');
            if (Buffer.byteLength(data) > limit) throw new Error();
            const findings = JSON.parse(data);
            if (!Array.isArray(findings)) throw new Error();
            console.log(`Gitleaks advisory findings: ${findings.length}`);
          } catch {
            console.error('Gitleaks report missing or invalid; contents withheld.');
            process.exitCode = 2;
          }
          NODE
