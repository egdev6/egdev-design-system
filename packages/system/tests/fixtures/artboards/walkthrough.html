<!doctype html>
<html lang="en">
<head>
  <title>WebTemplate artboard</title>
  <style>
    body { color: var(--color-action-primary-fg); font-family: var(--font-sans); }
    .section { padding: var(--spacing-4); }
    .card { border-radius: var(--radius-md); box-shadow: var(--shadow-btn-pressed); }
  </style>
</head>
<body data-component="WebTemplate">
  <header data-component="TopBar">Brand</header>
  <main>
    <section class="section" data-component="WebSection"><h1>Workshop</h1><button>Register</button></section>
    <section class="section" data-component="WebSection"><div class="card">Agenda</div></section>
  </main>
  <footer data-component="Footer">Footer</footer>
</body>
</html>
